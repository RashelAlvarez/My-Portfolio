<!-- ======= Header ======= -->
<header id="header" class="fixed-top d-flex justify-content-center align-items-center header-transparent">


  <nav id="navbar" class="navbar">
    <ul>
      <li><a class="nav-link scrollto active" href="#hero">{{ 'nav.first' | translate }}</a></li>
      <li><a class="nav-link scrollto" href="#about">{{ 'nav.second' | translate }}</a></li>
      <li><a class="nav-link scrollto" href="#services">{{ 'nav.third' | translate }}</a></li>
      <li><a class="nav-link scrollto " href="#portfolio">{{ 'nav.four' | translate }}</a></li>
      <li><a class="nav-link scrollto" href="#contact">{{ 'nav.five' | translate }}</a></li>
      <li><label for=""> {{ 'nav.idiom' | translate }}
          <select class="form-select form-select-sm m-2" #langSelect (change)="changeLang(langSelect.value)">
            <option *ngFor="let lang of langs" [value]="lang">
              {{lang}}</option>
          </select>
        </label></li>
    </ul>
    <i class="bi bi-list mobile-nav-toggle"></i>
  </nav><!-- .navbar -->

</header><!-- End Header -->



<!-- ======= Hero Section ======= -->
<section id="hero">
  <div class="hero-container">
    <h1>{{ 'nombre' | translate }}</h1>
    <h2>{{ 'saludo' | translate }}</h2>
    <a href="#about" class="btn-scroll scrollto" title="Scroll Down"><i class="bx bx-chevron-down"></i></a>
  </div>
</section><!-- End Hero -->
